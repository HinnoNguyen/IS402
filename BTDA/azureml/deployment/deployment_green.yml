$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: green
endpoint_name: credit-intent-endpoint
model: azureml:credit-intent-model@latest
code_configuration:
  code: .
  scoring_script: main.py
environment:
  conda_file: conda.yaml
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
instance_type: Standard_F2s_v2
instance_count: 1
data_collector:
  sampling_rate: 1.0
  rolling_rate: hour
  collections:
    model_inputs:
      enabled: "true"
    model_outputs:
      enabled: "true"
