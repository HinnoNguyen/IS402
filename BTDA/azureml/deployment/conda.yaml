# Môi trường cho endpoint credit-intent-endpoint.
# PHẢI khớp phiên bản lúc train model (job train trên cpu-cluster, Python 3.10):
#   - scikit-learn 1.7.2  (đọc từ _sklearn_version trong pipeline.joblib; bản 1.8+ không hỗ trợ Python 3.10)
#   - mlflow 2.22.2       (mlflow_version trong file MLmodel)
#   - numpy 2.x           (sklearn < 1.4 không chạy với numpy 2 -> lỗi "cannot import name 'ComplexWarning'")
# Đổi phiên bản ở train_job.yml / mlops_pipeline.yml thì phải đổi cả file này.
name: credit-intent-env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - mlflow==2.22.2
      - scikit-learn==1.7.2
      - numpy==2.2.6
      - scipy==1.15.3
      - pandas==2.3.3
      - joblib
      - xgboost>=3,<4
      - azureml-inference-server-http