# T41 – Azure ML Model Monitoring: Prediction Drift trên cột `label` của credit-intent-endpoint/blue
# Baseline: banking77-train-baseline-mltable:1 (cột label từ train.csv trên workspaceblobstore, 10.003 mẫu mapping v2)
# Production: credit-intent-endpoint-blue-model_outputs:1 (Data Collector T35, rolling_rate: hour)
# Lưu ý repo public: không ghi email cá nhân vào file này; truyền qua `--set create_monitor.alert_notification.emails=["<email>"]` hoặc bản copy tạm lúc chạy `az ml schedule create`.
$schema: https://azuremlschemas.azureedge.net/latest/schedule.schema.json
name: credit-intent-drift-monitor
display_name: Credit Intent Prediction Drift Monitor (T41)
description: Theo dõi Prediction Drift trên cột label của credit-intent-endpoint (blue) so với tập train Banking77 (mapping v2).

trigger:
  type: recurrence
  frequency: day
  interval: 1
  schedule:
    hours: [2]
    minutes: [0]

create_monitor:
  compute:
    instance_type: standard_e4s_v3
    runtime_version: "3.4"
  monitoring_target:
    ml_task: classification
    endpoint_deployment_id: azureml:credit-intent-endpoint:blue
  monitoring_signals:
    prediction_drift_signal:
      type: prediction_drift
      production_data:
        input_data:
          path: azureml:credit-intent-endpoint-blue-model_outputs:1
          type: uri_folder
        data_context: model_outputs
        data_window:
          lookback_window_size: P3D
          lookback_window_offset: P0D
      reference_data:
        input_data:
          path: azureml:banking77-train-baseline-mltable:1
          type: mltable
        data_context: training
      alert_enabled: true
      metric_thresholds:
        categorical:
          jensen_shannon_distance: 0.1
        numerical:
          normalized_wasserstein_distance: 0.1
